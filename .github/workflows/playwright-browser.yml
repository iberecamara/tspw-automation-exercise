name: Playwright Browser Test & Report (reusable)

on:
    workflow_call:
        inputs:
            browser:
                required: true
                type: string
            script:
                required: true
                type: string
            install_pkg:
                required: true
                type: string
            cache_extra_path:
                required: false
                type: string
                default: ""
        outputs:
            report_artifact:
                description: "Name of the uploaded single-file Allure report artifact"
                value: ${{ jobs.merge-report.outputs.report_artifact }}

env:
    BASE_URL: https://automationexercise.com
    APPLICATION: Automation Exercise
    WORKERS: 4
    RETRIES: 4
    SLOWMO: 300
    LOG_LINE_LENGTH: 100
    LOG_CONSOLE: true
    LOG_LEVEL: verbose
    HEADLESS: true
    JIRA_BOARD: SAMPLE
    SHARDS_TOTAL: 4

jobs:
    test:
        name: Test (${{ inputs.browser }} shard ${{ matrix.shardIndex }}/4)
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                shardIndex: [1, 2, 3, 4]
        env:
            SHARD_INDEX: ${{ matrix.shardIndex }}
            SHARD_TOTAL: 4
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --prefer-offline

            - name: Cache Playwright browsers
              uses: actions/cache@v5
              id: pw-cache
              with:
                  path: |
                      ~/.cache/ms-playwright
                      ${{ inputs.cache_extra_path }}
                  key: playwright-${{ inputs.browser }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps ${{ inputs.install_pkg }}
              if: steps.pw-cache.outputs.cache-hit != 'true'

            - name: Install Playwright OS deps only
              run: npx playwright install-deps
              if: steps.pw-cache.outputs.cache-hit == 'true'

            - name: Run Tests (${{ inputs.browser }} shard ${{ matrix.shardIndex }}/${{ env.SHARDS_TOTAL }})
              id: run-tests
              run: npm run ${{ inputs.script }} -- --shard=${{ matrix.shardIndex }}/${{ env.SHARDS_TOTAL }}
              continue-on-error: true

            - name: Upload raw Allure results (for merging)
              uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: allure-results-${{ inputs.browser }}-shard-${{ matrix.shardIndex }}
                  path: artifacts/reports/allure/allure-results
                  retention-days: 30
                  if-no-files-found: warn

            - name: Upload logs (for merging)
              uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: automation-logs-${{ inputs.browser }}-shard-${{ matrix.shardIndex }}
                  path: artifacts/logs/**/**/*.log
                  retention-days: 30
                  if-no-files-found: warn

            - name: Fail job if tests failed
              if: steps.run-tests.outcome == 'failure'
              run: |
                  echo "::error::Test suite failed for ${{ inputs.browser }} shard ${{ matrix.shardIndex }}/${{ env.SHARDS_TOTAL }}. See Allure Report/logs artifacts for details."
                  exit 1

    merge-report:
        name: Merge logs and generate Allure report (${{ inputs.browser }})
        needs: test
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        outputs:
            report_artifact: allure-report-${{ inputs.browser }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --prefer-offline

            - name: Download and merge Allure results from all shards
              uses: actions/download-artifact@v6
              with:
                  pattern: allure-results-${{ inputs.browser }}-*
                  path: artifacts/reports/allure/allure-results
                  merge-multiple: true

            - name: Download and merge logs from all shards
              uses: actions/download-artifact@v6
              with:
                  pattern: automation-logs-${{ inputs.browser }}-*
                  path: artifacts/logs
                  merge-multiple: true

            - name: Generate single file Allure Report (${{ inputs.browser }}, all shards combined)
              run: npm run report:allure:export

            - name: Upload Allure Report - Zipped File
              uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: allure-report-${{ inputs.browser }}
                  path: artifacts/reports/allure/allure-report-single
                  retention-days: 30
                  overwrite: true
                  if-no-files-found: warn

            - name: Upload logs
              uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: automation-logs-${{ inputs.browser }}
                  path: artifacts/logs/**/**/*.log
                  retention-days: 30
                  if-no-files-found: warn
