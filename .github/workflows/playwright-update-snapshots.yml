name: Update Playwright Visual Snapshots

on:
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: "playwright-update-snapshots-${{ github.ref }}"
    cancel-in-progress: false

env:
    BASE_URL: https://automationexercise.com
    APPLICATION: Automation Exercise
    WORKERS: 4
    RETRIES: 4
    SLOWMO: 500
    LOG_LINE_LENGTH: 100
    LOG_CONSOLE: true
    LOG_LEVEL: verbose
    HEADLESS: true
    JIRA_BOARD: SAMPLE
    SHARDS_TOTAL: 4

jobs:
    update-snapshots:
        name: Update @visual snapshots
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.ref }}
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --prefer-offline

            - name: Cache Playwright browsers
              uses: actions/cache@v5
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-all-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright browsers
              run: npx playwright install --with-deps

            - name: Update @visual snapshots
              id: update-snapshots
              run: |
                  run: npm test -- --update-snapshots --grep='(^|\\s)@visual(\\s|$)'
              continue-on-error: true

            - name: Check for snapshot changes
              id: snapshot-changes
              shell: bash
              run: |
                  snapshot_files="$(git status --porcelain=v1 | grep -E -- '-snapshots/' || true)"

                  if [[ -n "$snapshot_files" ]]; then
                      echo "changed=true" >> "$GITHUB_OUTPUT"

                      echo "Updated Playwright snapshots:"
                      echo "$snapshot_files"
                  else
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      echo "No Playwright snapshot changes detected."
                  fi

            - name: Commit updated snapshots
              if: steps.snapshot-changes.outputs.changed == 'true'
              shell: bash
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add -- '**/*-snapshots/**'

                  git commit \
                      -m "chore: update Playwright visual snapshots"

            - name: Push updated snapshots
              if: steps.snapshot-changes.outputs.changed == 'true'
              run: |
                  git push origin "HEAD:${{ github.ref_name }}"

            - name: Fail if Playwright failed
              if: steps.update-snapshots.outcome == 'failure'
              run: |
                  echo "::error::Playwright failed while updating @visual snapshots."
                  exit 1
