name: Vanilla Playwright Test Automation Framework for Automation Exercise website - All Browsers

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    static-checks:
        name: Type check, lint, and format check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --prefer-offline

            - name: Run type check, lint, and format check
              run: npm run codestandards

    chromium:
        name: Chromium
        needs: static-checks
        uses: ./.github/workflows/playwright-browser.yml
        with:
            browser: chromium
            script: test:chromium
            install_pkg: chromium

    chrome:
        name: Chrome
        needs: chromium
        uses: ./.github/workflows/playwright-browser.yml
        with:
            browser: chrome
            script: test:chrome
            install_pkg: chrome
            cache_extra_path: "/opt/google/chrome"

    firefox:
        name: Firefox
        needs: chrome
        uses: ./.github/workflows/playwright-browser.yml
        with:
            browser: firefox
            script: test:firefox
            install_pkg: firefox

    webkit:
        name: WebKit (Safari)
        needs: firefox
        uses: ./.github/workflows/playwright-browser.yml
        with:
            browser: webkit
            script: test:webkit
            install_pkg: webkit

    edge:
        name: Edge
        needs: webkit
        uses: ./.github/workflows/playwright-browser.yml
        with:
            browser: edge
            script: test:edge
            install_pkg: msedge
            cache_extra_path: "/opt/microsoft/msedge"

    build-hub:
        name: Build Allure hub and assemble Pages site
        needs: [chromium, chrome, firefox, webkit, edge]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Create site layout
              run: mkdir -p pages-site

            - name: Download Chromium report
              uses: actions/download-artifact@v6
              continue-on-error: true
              with:
                  name: allure-report-chromium
                  path: pages-site/chromium

            - name: Download Chrome report
              uses: actions/download-artifact@v6
              continue-on-error: true
              with:
                  name: allure-report-chrome
                  path: pages-site/chrome

            - name: Download Firefox report
              uses: actions/download-artifact@v6
              continue-on-error: true
              with:
                  name: allure-report-firefox
                  path: pages-site/firefox

            - name: Download WebKit report
              uses: actions/download-artifact@v6
              continue-on-error: true
              with:
                  name: allure-report-webkit
                  path: pages-site/webkit

            - name: Download Edge report
              uses: actions/download-artifact@v6
              continue-on-error: true
              with:
                  name: allure-report-edge
                  path: pages-site/edge

            - name: Generate hub index page
              run: |
                  cat > pages-site/index.html << 'HTMLEOF'
                  <!DOCTYPE html>
                  <html lang="en">
                  <head>
                    <meta charset="UTF-8">
                    <title>Automation Exercise - Allure Report Hub</title>
                    <style>
                      body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 720px; margin: 60px auto; padding: 0 20px; color: #1a1a1a; }
                      h1 { font-size: 1.6rem; margin-bottom: 4px; }
                      p.sub { color: #666; margin-top: 0; }
                      ul { list-style: none; padding: 0; }
                      li { margin: 10px 0; }
                      a.card { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border: 1px solid #ddd; border-radius: 8px; text-decoration: none; color: #1a1a1a; transition: border-color .15s ease; }
                      a.card:hover { border-color: #888; }
                      .name { font-weight: 600; }
                      .badge { font-size: 0.8rem; padding: 3px 10px; border-radius: 999px; font-weight: 600; }
                      .badge.success { background: #e3f8e8; color: #1a7d3a; }
                      .badge.failure { background: #fde7e7; color: #b3261e; }
                      .badge.other { background: #eee; color: #555; }
                      footer { margin-top: 40px; color: #999; font-size: 0.8rem; }
                    </style>
                  </head>
                  <body>
                    <h1>Automation Exercise — Allure Report Hub</h1>
                    <p class="sub">Per-browser Playwright test reports for this run</p>
                    <ul id="report-list"></ul>
                    <footer>Generated automatically by GitHub Actions</footer>
                    <script>
                      const reports = REPORTS_JSON_PLACEHOLDER;
                      const list = document.getElementById('report-list');
                      reports.forEach(r => {
                        const li = document.createElement('li');
                        const badgeClass = r.status === 'success' ? 'success' : (r.status === 'failure' ? 'failure' : 'other');
                        li.innerHTML = `<a class="card" href="./${r.slug}/index.html"><span class="name">${r.label}</span><span class="badge ${badgeClass}">${r.status}</span></a>`;
                        list.appendChild(li);
                      });
                    </script>
                  </body>
                  </html>
                  HTMLEOF

            - name: Inject report statuses into hub page
              run: |
                  python3 - << 'PYEOF'
                  import json

                  reports = [
                      {"slug": "chromium", "label": "Chromium", "status": "${{ needs.chromium.result }}"},
                      {"slug": "chrome", "label": "Chrome", "status": "${{ needs.chrome.result }}"},
                      {"slug": "firefox", "label": "Firefox", "status": "${{ needs.firefox.result }}"},
                      {"slug": "webkit", "label": "WebKit (Safari)", "status": "${{ needs.webkit.result }}"},
                      {"slug": "edge", "label": "Edge", "status": "${{ needs.edge.result }}"},
                  ]

                  with open("pages-site/index.html") as f:
                      html = f.read()

                  html = html.replace("REPORTS_JSON_PLACEHOLDER", json.dumps(reports))

                  with open("pages-site/index.html", "w") as f:
                      f.write(html)
                  PYEOF

            - name: Upload Allure Report Hub - Zipped File
              uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: Allure Report - Hub (All Browsers)
                  path: pages-site
                  retention-days: 30
                  overwrite: true
                  if-no-files-found: warn

            - name: Upload Report for Pages (build-time)
              uses: actions/upload-pages-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  path: pages-site

    deploy:
        needs: build-hub
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
